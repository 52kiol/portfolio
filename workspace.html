<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 · 52Kiol</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "SF Pro Display", -apple-system, "PingFang SC", sans-serif;
    background: #1e1e2e; overflow:hidden; height:100vh;
    user-select: none; -webkit-user-select: none;
  }

  /* ===== 桌面 ===== */
  .desktop {
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 80% 60% at 30% 20%, rgba(120,120,255,0.15) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 70% 60%, rgba(255,180,100,0.10) 0%, transparent 60%),
      linear-gradient(160deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
  }

  /* ===== 菜单栏 ===== */
  .menubar {
    position:fixed; top:0; left:0; right:0; z-index:100;
    height:28px; background:rgba(30,30,40,0.75);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display:flex; align-items:center; padding:0 12px;
    border-bottom:0.5px solid rgba(255,255,255,0.08);
    font-size:12px; color:#bbb;
  }
  .menubar .apple { font-size:15px; margin-right:16px; color:#ccc; cursor:default; }
  .menubar span { margin-right:18px; cursor:default; }
  .menubar .time { margin-left:auto; color:#888; }

  /* ===== 桌面图标网格 ===== */
  .icon-grid {
    position:absolute; top:60px; left:24px;
    display:flex; flex-wrap:wrap; gap:18px;
    max-width:calc(100vw - 48px);
  }
  .desktop-icon {
    width:88px; display:flex; flex-direction:column; align-items:center;
    cursor:pointer; padding:8px 4px; border-radius:8px;
    transition: background 0.15s;
    text-decoration:none;
  }
  .desktop-icon:hover { background:rgba(255,255,255,0.08); }
  .desktop-icon:active { background:rgba(255,255,255,0.15); }

  .desktop-icon .icon-img {
    width:56px; height:56px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:28px; margin-bottom:6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .desktop-icon .icon-label {
    font-size:11px; color:#ddd; text-align:center;
    line-height:1.3; word-break:keep-all;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }

  /* 各图标颜色 */
  .icon-globe  { background:linear-gradient(135deg, #4a9eff, #2563eb); }
  .icon-folder { background:linear-gradient(135deg, #5b9cf5, #3b82f6); }
  .icon-code   { background:linear-gradient(135deg, #007acc, #005a9e); }
  .icon-video  { background:linear-gradient(135deg, #7c3aed, #6d28d9); }
  .icon-image  { background:linear-gradient(135deg, #f59e0b, #d97706); }
  .icon-music  { background:linear-gradient(135deg, #ef4444, #dc2626); }
  .icon-zip    { background:linear-gradient(135deg, #6b7280, #4b5563); }
  .icon-app    { background:linear-gradient(135deg, #10b981, #059669); }

  /* ===== Dock ===== */
  .dock {
    position:fixed; bottom:12px; left:50%; transform:translateX(-50%); z-index:100;
    display:flex; gap:6px; padding:8px 14px;
    background:rgba(255,255,255,0.06);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border:0.5px solid rgba(255,255,255,0.10);
    border-radius:18px;
  }
  .dock-item {
    width:40px; height:40px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; cursor:pointer; transition: all 0.2s;
    position:relative; text-decoration:none;
  }
  .dock-item:hover { transform:scale(1.25) translateY(-6px); }
  .dock-item::after {
    content:''; position:absolute; bottom:-6px;
    width:4px; height:4px; border-radius:50%;
    background:rgba(255,255,255,0.3); opacity:0; transition:opacity 0.2s;
  }
  .dock-item:hover::after { opacity:1; }

  /* ===== 右键菜单（装饰） ===== */
  .context-hint {
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
    font-size:11px; color:rgba(255,255,255,0.2); pointer-events:none;
  }
</style>
</head>
<body>

<!-- 菜单栏 -->
<div class="menubar">
  <span class="apple">&#63743;</span>
  <span>Finder</span>
  <span>文件</span>
  <span>编辑</span>
  <span>显示</span>
  <span>窗口</span>
  <span class="time" id="menutime"></span>
</div>

<!-- 桌面 -->
<div class="desktop">

  <!-- 图标 -->
  <div class="icon-grid">
    <a class="desktop-icon" href="https://love.mmy567.com/#/dashboard" target="_blank" rel="noopener">
      <div class="icon-img icon-globe">&#127760;</div>
      <span class="icon-label">魔法上网</span>
    </a>

    <div class="desktop-icon" style="cursor:default; opacity:0.35;">
      <div class="icon-img icon-code">&#9000;</div>
      <span class="icon-label">即将上线</span>
    </div>

    <div class="desktop-icon" style="cursor:default; opacity:0.35;">
      <div class="icon-img icon-folder">&#128193;</div>
      <span class="icon-label">即将上线</span>
    </div>
  </div>

</div>

<!-- 提示 -->
<div class="context-hint">双击图标打开 · 右键查看更多</div>

<!-- Dock -->
<div class="dock">
  <a class="dock-item" href="index.html" title="返回主页" style="background:linear-gradient(135deg,#c44f4f,#a33);">&#127968;</a>
  <a class="dock-item" href="https://love.mmy567.com/#/dashboard" target="_blank" rel="noopener" title="魔法上网" style="background:linear-gradient(135deg,#4a9eff,#2563eb);">&#127760;</a>
  <div class="dock-item" style="background:linear-gradient(135deg,#6b7280,#4b5563); font-size:14px;">&#9881;</div>
</div>

<script>
// 菜单栏时间
(function tick(){
  const now = new Date();
  document.getElementById('menutime').textContent =
    now.toLocaleDateString('zh-CN',{weekday:'short',month:'short',day:'numeric'}) +
    ' ' + now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  setTimeout(tick,30000);
})();
tick();
</script>

</body>
</html>
